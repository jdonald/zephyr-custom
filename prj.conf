# Project Configuration for Hello World Application
# This file demonstrates Kconfig configuration modifications

# =============================================================================
# Core Kernel Settings
# =============================================================================

# Enable kernel statistics for debugging
CONFIG_KERNEL_BIN_NAME="hello_armv7"

# Stack sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# =============================================================================
# Console and Logging
# =============================================================================

# Serial console settings
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Logging subsystem
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Printk settings
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# =============================================================================
# GPIO and Hardware
# =============================================================================

# GPIO support for LEDs and buttons
CONFIG_GPIO=y

# Hardware floating point (Cortex-M4F)
CONFIG_FPU=y

# =============================================================================
# Application-Specific Settings (Kconfig Demo)
# =============================================================================

# Custom application version - demonstrating Kconfig string option
CONFIG_HELLO_APP_VERSION="1.0.0-custom"

# LED blink interval - demonstrating Kconfig integer option
CONFIG_HELLO_BLINK_INTERVAL_MS=500

# Enable debug logging - demonstrating Kconfig bool option
CONFIG_HELLO_ENABLE_DEBUG_LOG=y

# Custom board feature settings
CONFIG_CUSTOM_BOARD_LED_COUNT=3
CONFIG_CUSTOM_BOARD_BUTTON_COUNT=1

# =============================================================================
# Memory and Performance
# =============================================================================

# Heap configuration
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Thread-aware debugging
CONFIG_DEBUG_THREAD_INFO=y

# =============================================================================
# Build Optimization
# =============================================================================

# Optimize for size (good for embedded)
CONFIG_SIZE_OPTIMIZATIONS=y

# Enable link-time optimization
CONFIG_LTO=n

# Compiler optimizations
CONFIG_COMPILER_OPT="-Os"
